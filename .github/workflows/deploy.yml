name: Release & Deploy

on:
  release:
    types: [published]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  guard:
    name: Verify release is from main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release commit is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "OK: $GITHUB_SHA is part of main."
          else
            echo "::error::Release tag '${{ github.event.release.tag_name }}' is not based on the main branch."
            exit 1
          fi

  build:
    name: Build, test & push image
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UniiaAnonim.TGBot.slnx

      - name: Build
        run: dotnet build UniiaAnonim.TGBot.slnx -c Release --no-restore

      - name: Test
        run: dotnet test UniiaAnonim.TGBot.slnx -c Release --no-build --verbosity normal

      - name: Compute image name
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${REPO_LC}:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=ghcr.io/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Orange Pi 5 is RK3588 (aarch64). Publish a single Debian linux/arm64 image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    name: Generate release description
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose description (links + changelog)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          set -euo pipefail
          REPO_LC="${GITHUB_REPOSITORY,,}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          IMAGE="ghcr.io/${REPO_LC}:${RELEASE_TAG}"
          PKG_URL="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${REPO_NAME}"

          # Auto-generated changelog (merged PRs, commits, contributors, compare link).
          # previous_tag is auto-detected by GitHub.
          CHANGELOG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" --jq '.body')

          {
            echo "## Deployment"
            echo
            echo "- **Live bot:** ${BASE_URL}"
            echo "- **Logs:** ${BASE_URL}/main/logs/"
            echo "- **Container image:** \`${IMAGE}\` (\`linux/arm64\`, Debian 13, Orange Pi 5)"
            echo "- **GHCR package:** ${PKG_URL}"
            echo "- **Source commit:** https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo
            echo "${CHANGELOG}"
          } > body.md

          gh release edit "${RELEASE_TAG}" --notes-file body.md
